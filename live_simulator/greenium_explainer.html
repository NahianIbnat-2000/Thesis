<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Greenium, Explained — Ibnat (2026)</title>
<style>
  :root{
    --bg:#0B1220; --panel:#111B2E; --panel-2:#16233B; --grid:#22324F;
    --text:#E7EDF7; --muted:#8FA0BC;
    --good:#2DD4A7; --warn:#F5B83D; --bad:#FF5C5C; --vix:#B78CFF;
    --thresh:#F5B83D; --event:#4DA3FF;
    --mono:"SF Mono","Cascadia Mono",Consolas,Menlo,monospace;
    --sans:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);font-family:var(--sans);height:100%;overflow:hidden}
  #stage{position:relative;width:100vw;height:100vh;max-width:1100px;margin:0 auto;
    display:flex;align-items:center;justify-content:center}
  .scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:48px 36px 110px;opacity:0;pointer-events:none;transition:opacity .55s ease}
  .scene.active{opacity:1;pointer-events:auto}

  .kicker{font-family:var(--mono);font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--good);margin-bottom:14px;opacity:0;transform:translateY(8px)}
  .scene.active .kicker{animation:rise .6s .1s forwards}
  h1{font-size:clamp(28px,5vw,52px);font-weight:700;line-height:1.08;text-align:center;max-width:14ch;opacity:0;transform:translateY(12px)}
  .scene.active h1{animation:rise .7s .25s forwards}
  h1 .g{color:var(--good)} h1 .r{color:var(--bad)} h1 .gold{color:var(--thresh)}
  .lead{font-size:clamp(15px,2.2vw,20px);color:var(--muted);text-align:center;max-width:46ch;margin-top:18px;line-height:1.5;opacity:0;transform:translateY(12px)}
  .scene.active .lead{animation:rise .7s .5s forwards}
  @keyframes rise{to{opacity:1;transform:none}}

  /* big animated number */
  .bignum{font-family:var(--mono);font-weight:700;font-size:clamp(46px,11vw,120px);line-height:1;margin:6px 0}
  .unit{font-size:.4em;color:var(--muted)}

  /* chart canvas */
  .chartbox{width:100%;max-width:760px;background:var(--panel);border:1px solid var(--grid);border-radius:12px;
    margin-top:22px;overflow:hidden;opacity:0;transform:translateY(16px)}
  .scene.active .chartbox{animation:rise .7s .6s forwards}
  .chartbox h2{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
    padding:9px 13px;border-bottom:1px solid var(--grid);background:var(--panel-2);display:flex;justify-content:space-between}
  .chartbox h2 .tag{transition:color .4s}
  canvas{display:block;width:100%;height:300px}

  /* regime pill */
  .pill{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:13px;font-weight:700;
    letter-spacing:.08em;padding:8px 16px;border-radius:6px;margin-top:8px;transition:all .5s}
  .pill.thin{background:rgba(255,92,92,.13);color:var(--bad);border:1px solid var(--bad)}
  .pill.mature{background:rgba(45,212,167,.13);color:var(--good);border:1px solid var(--good)}

  /* two-up comparison cards */
  .twoup{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:100%;max-width:760px;margin-top:24px}
  @media(max-width:640px){.twoup{grid-template-columns:1fr}}
  .ucard{background:var(--panel);border:1px solid var(--grid);border-radius:12px;padding:18px;opacity:0;transform:translateY(16px)}
  .scene.active .ucard{animation:rise .6s forwards}
  .scene.active .ucard:nth-child(1){animation-delay:.55s}
  .scene.active .ucard:nth-child(2){animation-delay:.8s}
  .ucard .uh{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  .ucard .uv{font-family:var(--mono);font-size:30px;font-weight:700}
  .ucard .us{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.4}

  /* stat row */
  .statrow{display:flex;gap:30px;flex-wrap:wrap;justify-content:center;margin-top:26px}
  .stat{text-align:center;opacity:0;transform:translateY(14px)}
  .scene.active .stat{animation:rise .6s forwards}
  .scene.active .stat:nth-child(1){animation-delay:.5s}
  .scene.active .stat:nth-child(2){animation-delay:.7s}
  .scene.active .stat:nth-child(3){animation-delay:.9s}
  .stat .sv{font-family:var(--mono);font-size:34px;font-weight:700}
  .stat .sl{font-size:12px;color:var(--muted);margin-top:4px;max-width:16ch}

  /* controls bar */
  #bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(11,18,32,.82);backdrop-filter:blur(8px);
    border-top:1px solid var(--grid);padding:12px 18px;display:flex;align-items:center;gap:14px}
  #bar .play{width:42px;height:42px;border-radius:50%;border:1px solid var(--good);background:var(--good);color:var(--bg);
    font-size:17px;cursor:pointer;flex:none;font-weight:700}
  #bar .play.paused{background:transparent;color:var(--good)}
  #track{flex:1;height:6px;background:var(--grid);border-radius:4px;position:relative;cursor:pointer}
  #fill{position:absolute;left:0;top:0;bottom:0;background:var(--good);border-radius:4px;width:0%}
  #dots{display:flex;gap:7px;flex:none}
  #dots .d{width:9px;height:9px;border-radius:50%;background:var(--grid);cursor:pointer;transition:background .3s}
  #dots .d.on{background:var(--good)}
  #scn{font-family:var(--mono);font-size:11px;color:var(--muted);flex:none;min-width:42px;text-align:right}
  .replay{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text);
    background:transparent;border:1px solid var(--grid);border-radius:6px;padding:8px 12px;cursor:pointer;flex:none}

  .src{position:fixed;top:14px;right:16px;font-family:var(--mono);font-size:10px;color:var(--muted);z-index:20}
  .footnote{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:20px;max-width:52ch;text-align:center;line-height:1.5;opacity:0}
  .scene.active .footnote{animation:rise .7s 1s forwards}
  @media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="src">Ibnat (2026) · CEU</div>
<div id="stage"></div>

<div id="bar">
  <button class="play" id="play">⏸</button>
  <div id="track"><div id="fill"></div></div>
  <div id="dots"></div>
  <div id="scn">1/7</div>
  <button class="replay" id="replay">↻ Replay</button>
</div>

<script>
"use strict";
const $=s=>document.querySelector(s);
const stage=$("#stage");

/* ---------- scene definitions ---------- */
// each scene: html builder + duration(ms) + optional onEnter(canvas animation)
const C={good:"#2DD4A7",warn:"#F5B83D",bad:"#FF5C5C",vix:"#B78CFF",grid:"#22324F",muted:"#8FA0BC",event:"#4DA3FF",thresh:"#F5B83D"};

const SCENES=[
 { dur:6500, build:()=>`
    <div class="kicker">When governments say "green"</div>
    <h1>Do bond markets <span class="g">believe</span> them?</h1>
    <div class="lead">A sovereign issues a <b>green bond</b>. If investors trust the promise, they accept a lower yield — a discount called the <b style="color:var(--good)">greenium</b>. This is the story of whether that trust shows up in the price.</div>
    <div class="footnote">MA Thesis · Economics, Data &amp; Policy · Central European University</div>` },

 { dur:7000, build:()=>`
    <div class="kicker">The measurement</div>
    <h1>One green bond, <span class="g">one twin</span></h1>
    <div class="lead">Pair each green bond with a conventional bond from the same issuer, same maturity. The daily yield gap between them <i>is</i> the greenium — in basis points.</div>
    <div class="twoup">
      <div class="ucard"><div class="uh">Green bond yield</div><div class="uv" style="color:var(--good)">7.23%</div><div class="us">The labelled "use-of-proceeds" bond</div></div>
      <div class="ucard"><div class="uh">Conventional twin</div><div class="uv">7.24%</div><div class="us">Identical issuer &amp; maturity, no label</div></div>
    </div>
    <div class="lead" style="margin-top:18px">The gap is tiny. The question is whether <b>anything a government does</b> can move it.</div>` },

 { dur:9000, canvas:"thin", build:()=>`
    <div class="kicker">The emerging market — India &amp; Indonesia</div>
    <h1>In a <span class="r">thin</span> market, the line is just noise</h1>
    <div class="chartbox"><h2><span>Greenium (bp)</span><span class="tag" id="tag1" style="color:var(--bad)">THIN · MACRO-DOMINATED</span></h2><canvas id="cv1"></canvas></div>
    <div class="lead" style="margin-top:16px">Fire a credibility event — an auction, a climate pledge — and watch. <b style="color:var(--bad)">The price doesn't react.</b> The signal never reaches it.</div>` },

 { dur:8000, canvas:"vix", build:()=>`
    <div class="kicker">So what <i>does</i> move it?</div>
    <h1>Only <span style="color:var(--vix)">global fear</span> moves the price</h1>
    <div class="chartbox"><h2><span>Greenium vs VIX shock</span><span class="tag" style="color:var(--vix)">RISK-OFF</span></h2><canvas id="cv2"></canvas></div>
    <div class="lead" style="margin-top:16px">When the VIX spikes, investors dump the less-liquid green leg first. Fear is priced. Promises are not. <b>~0.45 bp per standard deviation of VIX</b> — the one robust driver.</div>` },

 { dur:8500, canvas:"cross", build:()=>`
    <div class="kicker">The turning point</div>
    <h1>Cross the <span class="gold">depth threshold</span></h1>
    <div class="chartbox"><h2><span>Greenium (bp)</span><span class="tag" id="tag3" style="color:var(--bad)">THIN → MATURE</span></h2><canvas id="cv3"></canvas></div>
    <div class="lead" style="margin-top:16px">Build an institutional investor base — pension mandates, market-makers, index inclusion. Once depth is deep enough, the market changes character. <b style="color:var(--good)">Now the same signal reprices.</b></div>` },

 { dur:8000, build:()=>`
    <div class="kicker">The developed-market benchmark</div>
    <h1>Where the greenium <span class="g">is</span> real</h1>
    <div class="statrow">
      <div class="stat"><div class="sv" style="color:var(--good)" data-count="-1.82" data-suffix=" bp">0</div><div class="sl">Germany — persistent greenium</div></div>
      <div class="stat"><div class="sv" style="color:var(--good)" data-count="-2.80" data-suffix=" bp">0</div><div class="sl">Denmark — persistent greenium</div></div>
      <div class="stat"><div class="sv" style="color:var(--vix)" data-count="60" data-suffix="">0</div><div class="sl">depth threshold, on this model's scale</div></div>
    </div>
    <div class="lead" style="margin-top:26px">In deep, mandate-anchored markets the greenium is set at issuance and barely moves. The emerging-market <b style="color:var(--bad)">null</b> isn't a flaw in green bonds — it's a feature of <b>thin markets</b>.</div>` },

 { dur:99999, build:()=>`
    <div class="kicker">The finding, in one line</div>
    <h1>Credibility needs a <span class="g">receiver</span></h1>
    <div class="lead">Below a threshold of market depth, a government cannot manufacture a greenium by signalling louder. The price only listens once the market is deep enough to hear.</div>
    <div class="statrow" style="margin-top:30px">
      <div class="stat"><div class="sv" style="color:var(--bad)">NULL</div><div class="sl">credibility → greenium, India &amp; Indonesia</div></div>
      <div class="stat"><div class="sv" style="color:var(--vix)">VIX</div><div class="sl">the only robust daily driver</div></div>
      <div class="stat"><div class="sv" style="color:var(--good)">DEPTH</div><div class="sl">the precondition for trust to price</div></div>
    </div>
    <div class="footnote">A stylized illustration of one interpretation — the market-development-threshold reading — consistent with, but not directly identified by, the thesis evidence. Explore it yourself in the live simulator.</div>` }
];

/* ---------- canvas animations ---------- */
function setup(cv){
  const dpr=window.devicePixelRatio||1, r=cv.getBoundingClientRect();
  const w=Math.round(r.width)||700, h=Math.round(parseInt(getComputedStyle(cv).height))||300;
  cv.width=w*dpr; cv.height=h*dpr;
  const ctx=cv.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx,W:w,H:h};
}
function axes(ctx,W,H,yMin,yMax){
  const padL=40,padR=12,padT=14,padB=20;
  const y=v=>padT+(yMax-v)/(yMax-yMin)*(H-padT-padB);
  const x=t=>padL+t*(W-padL-padR);
  ctx.clearRect(0,0,W,H);
  ctx.font="10px monospace";ctx.fillStyle=C.muted;ctx.textAlign="right";
  for(let v=Math.ceil(yMin);v<=yMax;v+=2){
    ctx.strokeStyle=C.grid;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(padL,y(v));ctx.lineTo(W-padR,y(v));ctx.stroke();
    ctx.fillStyle=C.muted;ctx.fillText((v>0?"+":"")+v,padL-6,y(v)+3);
  }
  // zero & target lines
  ctx.strokeStyle="#33415f";ctx.lineWidth=1.3;ctx.beginPath();ctx.moveTo(padL,y(0));ctx.lineTo(W-padR,y(0));ctx.stroke();
  ctx.strokeStyle=C.good;ctx.setLineDash([6,4]);ctx.beginPath();ctx.moveTo(padL,y(-2));ctx.lineTo(W-padR,y(-2));ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle=C.good;ctx.textAlign="left";ctx.fillText("−2 bp target",padL+4,y(-2)-4);
  return {x,y,padL,padR,padT,padB};
}
function colorFor(v){return v<=-2?C.good:v>0?C.bad:C.warn;}

let raf=null;
function animThin(){ // noisy line, event marker that does nothing
  const cv=$("#cv1");if(!cv)return;const {ctx,W,H}=setup(cv);
  const N=120, ev=70; let seed=7;
  const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280;};
  const data=[];let g=0.5;
  for(let i=0;i<N;i++){g=0.6*g+0.4*0.5+(rnd()-0.5)*5.0;data.push(g);} // big sigma, event has no effect
  let f=0;
  cancelAnimationFrame(raf);
  (function loop(){
    const A=axes(ctx,W,H,-9,7);const n=Math.floor(f);
    // event marker
    if(n>ev){const ex=A.x(ev/(N-1));ctx.strokeStyle=C.event;ctx.setLineDash([4,4]);ctx.lineWidth=1.4;
      ctx.beginPath();ctx.moveTo(ex,A.padT);ctx.lineTo(ex,H-A.padB);ctx.stroke();ctx.setLineDash([]);
      ctx.fillStyle=C.event;ctx.textAlign="center";ctx.font="9px monospace";ctx.fillText("credibility event",ex,A.padT+9);}
    ctx.lineWidth=2;
    for(let i=1;i<=n&&i<N;i++){ctx.strokeStyle=colorFor(data[i]);ctx.beginPath();
      ctx.moveTo(A.x((i-1)/(N-1)),A.y(Math.max(-9,Math.min(7,data[i-1]))));
      ctx.lineTo(A.x(i/(N-1)),A.y(Math.max(-9,Math.min(7,data[i]))));ctx.stroke();}
    f+=1.7;if(f<N){raf=requestAnimationFrame(loop);}
  })();
}
function animVix(){ // greenium calm, then a VIX spike drags it down and back — visibly reacting
  const cv=$("#cv2");if(!cv)return;const {ctx,W,H}=setup(cv);
  const N=120,spike=58;let seed=23;
  const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280;};
  const data=[];let g=-0.4;
  for(let i=0;i<N;i++){
    // VIX impulse: sharp jump at spike, decaying over ~22 days
    const vixDev=(i>=spike)?(2.6*Math.exp(-(i-spike)/11)):0;
    const tgt=-0.4 - 2.4*vixDev;                 // fear pushes greenium up (less negative / positive)
    g=0.55*g+0.45*tgt+(rnd()-0.5)*1.3;           // genuine noise
    data.push(g);
  }
  let f=0;cancelAnimationFrame(raf);
  (function loop(){
    const A=axes(ctx,W,H,-9,7);const n=Math.floor(f);
    if(n>spike){const ex=A.x(spike/(N-1));ctx.strokeStyle=C.vix;ctx.setLineDash([4,4]);ctx.lineWidth=1.6;
      ctx.beginPath();ctx.moveTo(ex,A.padT);ctx.lineTo(ex,H-A.padB);ctx.stroke();ctx.setLineDash([]);
      ctx.fillStyle=C.vix;ctx.textAlign="center";ctx.font="9px monospace";ctx.fillText("VIX spike",ex,A.padT+9);}
    ctx.lineWidth=2;
    for(let i=1;i<=n&&i<N;i++){ctx.strokeStyle=colorFor(data[i]);ctx.beginPath();
      ctx.moveTo(A.x((i-1)/(N-1)),A.y(Math.max(-9,Math.min(7,data[i-1]))));
      ctx.lineTo(A.x(i/(N-1)),A.y(Math.max(-9,Math.min(7,data[i]))));ctx.stroke();}
    f+=1.7;if(f<N){raf=requestAnimationFrame(loop);}
  })();
}
function animCross(){ // noisy -> crosses threshold -> settles negative, second event works
  const cv=$("#cv3");if(!cv)return;const {ctx,W,H}=setup(cv);
  const N=140,cross=70,ev2=105;let seed=41;
  const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280;};
  const data=[];let g=0.5;
  for(let i=0;i<N;i++){if(i<cross){g=0.6*g+0.4*0.5+(rnd()-0.5)*4.6;}
    else{const tgt=-2.8;g=0.8*g+0.2*tgt+(rnd()-0.5)*1.0;}data.push(g);}
  let f=0;cancelAnimationFrame(raf);
  (function loop(){
    const A=axes(ctx,W,H,-9,7);const n=Math.floor(f);
    // threshold band
    const cx=A.x(cross/(N-1));
    ctx.strokeStyle=C.thresh;ctx.setLineDash([3,3]);ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(cx,A.padT);ctx.lineTo(cx,H-A.padB);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle=C.thresh;ctx.textAlign="center";ctx.font="9px monospace";ctx.fillText("DEPTH ≥ 60",cx,A.padT+9);
    if(n>ev2){const ex=A.x(ev2/(N-1));ctx.strokeStyle=C.event;ctx.setLineDash([4,4]);ctx.lineWidth=1.4;
      ctx.beginPath();ctx.moveTo(ex,A.padT);ctx.lineTo(ex,H-A.padB);ctx.stroke();ctx.setLineDash([]);
      ctx.fillStyle=C.event;ctx.fillText("same signal — now it prices",ex,H-A.padB-6);}
    ctx.lineWidth=2;
    for(let i=1;i<=n&&i<N;i++){ctx.strokeStyle=colorFor(data[i]);ctx.beginPath();
      ctx.moveTo(A.x((i-1)/(N-1)),A.y(Math.max(-9,Math.min(7,data[i-1]))));
      ctx.lineTo(A.x(i/(N-1)),A.y(Math.max(-9,Math.min(7,data[i]))));ctx.stroke();}
    // tag flip
    const tag=$("#tag3");if(tag){if(n>cross){tag.textContent="MATURE · MANDATE-ANCHORED";tag.style.color=C.good;}else{tag.textContent="THIN · MACRO-DOMINATED";tag.style.color=C.bad;}}
    f+=1.6;if(f<N){raf=requestAnimationFrame(loop);}
  })();
}
function animCount(){ // count up the stat numbers
  document.querySelectorAll(".stat .sv[data-count]").forEach(el=>{
    const target=parseFloat(el.dataset.count),suf=el.dataset.suffix||"";const neg=target<0;
    let t0=null,dur=1100;
    function step(ts){if(!t0)t0=ts;const p=Math.min(1,(ts-t0)/dur);const e=1-Math.pow(1-p,3);
      const val=target*e;el.textContent=(val>0&&!neg?"+":"")+(Math.abs(target)<10?val.toFixed(2):Math.round(val))+suf;
      if(p<1)requestAnimationFrame(step);}
    requestAnimationFrame(step);
  });
}

/* ---------- player ---------- */
let idx=0, playing=true, sceneStart=0, rafBar=null;
function buildDots(){const d=$("#dots");d.innerHTML="";SCENES.forEach((_,i)=>{const s=document.createElement("span");s.className="d"+(i===0?" on":"");s.onclick=()=>go(i);d.appendChild(s);});}
function render(i){
  stage.innerHTML="";
  const sc=document.createElement("div");sc.className="scene active";sc.innerHTML=SCENES[i].build();
  stage.appendChild(sc);
  $("#scn").textContent=(i+1)+"/"+SCENES.length;
  document.querySelectorAll("#dots .d").forEach((d,k)=>d.classList.toggle("on",k===i));
  // trigger scene-specific animation slightly after fade-in
  const c=SCENES[i].canvas;
  setTimeout(()=>{
    if(c==="thin")animThin(); else if(c==="vix")animVix(); else if(c==="cross")animCross();
    if(i===5)animCount();
  }, 650);
}
function go(i){idx=(i+SCENES.length)%SCENES.length;render(idx);sceneStart=performance.now();}
function tick(ts){
  if(playing){
    const dur=SCENES[idx].dur;
    const p=Math.min(1,(ts-sceneStart)/dur);
    $("#fill").style.width=(p*100)+"%";
    if(p>=1 && idx<SCENES.length-1){go(idx+1);}
  }
  rafBar=requestAnimationFrame(tick);
}
$("#play").onclick=()=>{playing=!playing;$("#play").textContent=playing?"⏸":"▶";$("#play").classList.toggle("paused",!playing);
  if(playing)sceneStart=performance.now()-SCENES[idx].dur*(parseFloat($("#fill").style.width||0)/100);};
$("#replay").onclick=()=>{go(0);playing=true;$("#play").textContent="⏸";$("#play").classList.remove("paused");};
$("#track").onclick=e=>{const r=$("#track").getBoundingClientRect();const p=(e.clientX-r.left)/r.width;
  sceneStart=performance.now()-SCENES[idx].dur*p;$("#fill").style.width=(p*100)+"%";};
document.addEventListener("keydown",e=>{
  if(e.key===" "){e.preventDefault();$("#play").click();}
  if(e.key==="ArrowRight")go(idx+1);
  if(e.key==="ArrowLeft")go(idx-1);
});
window.addEventListener("resize",()=>{const c=SCENES[idx].canvas;if(c==="thin")animThin();else if(c==="vix")animVix();else if(c==="cross")animCross();});

buildDots();go(0);sceneStart=performance.now();rafBar=requestAnimationFrame(tick);
</script>
</body>
</html>
