<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Admin — Upload Corpus</title>
  <style>
    body { font-family: monospace; background: #0d1117; color: #e6edf3; padding: 40px; max-width: 600px; margin: 0 auto; }
    h1 { color: #d4a843; font-size: 18px; }
    input, button { font-family: monospace; font-size: 13px; }
    .row { margin: 16px 0; }
    label { display: block; color: #8b949e; margin-bottom: 6px; font-size: 12px; letter-spacing: .05em; }
    input[type=text] { background: #161b22; border: 1px solid #30363d; color: #e6edf3; padding: 8px 10px; width: 100%; box-sizing: border-box; }
    input[type=file] { color: #e6edf3; }
    button { background: #d4a843; color: #0d1117; border: none; padding: 9px 20px; cursor: pointer; font-weight: bold; margin-top: 8px; }
    button:hover { opacity: .85; }
    #log { margin-top: 24px; background: #161b22; border: 1px solid #30363d; padding: 14px; font-size: 12px; color: #3fb950; min-height: 60px; white-space: pre-wrap; }
    #status { margin-top: 16px; font-size: 12px; color: #8b949e; }
  </style>
</head>
<body>
  <h1>📚 Corpus Admin Panel</h1>
  <p style="font-size:12px;color:#8b949e;">Upload PDFs to the backend. Keep this page private.</p>

  <div class="row">
    <label>BACKEND URL</label>
    <input type="text" id="backendUrl" placeholder="https://green-bond-assistant.onrender.com" />
  </div>

  <div class="row">
    <label>SELECT PDF</label>
    <input type="file" id="pdfFile" accept=".pdf" multiple />
    <button onclick="uploadFiles()">Upload</button>
  </div>

  <div id="log">Waiting...</div>
  <div id="status"></div>

  <script>
    const log = m => { document.getElementById('log').textContent += m + '\n'; };

    async function uploadFiles() {
      const url  = document.getElementById('backendUrl').value.trim().replace(/\/$/, '');
      const files = document.getElementById('pdfFile').files;
      if (!url)   { log('ERROR: enter backend URL first'); return; }
      if (!files.length) { log('ERROR: select at least one PDF'); return; }

      document.getElementById('log').textContent = '';
      for (const file of files) {
        log(`Uploading ${file.name}...`);
        const fd = new FormData();
        fd.append('file', file);
        try {
          const r = await fetch(`${url}/upload`, { method: 'POST', body: fd });
          const j = await r.json();
          log(r.ok ? `✓ ${j.message}` : `✗ ${j.detail}`);
        } catch(e) { log(`✗ Network error: ${e}`); }
      }
      await checkStatus(url);
    }

    async function checkStatus(url) {
      try {
        const r = await fetch(`${url}/status`);
        const j = await r.json();
        document.getElementById('status').textContent =
          `Index: ${j.chunk_count} chunks | Sources: ${j.sources.join(', ') || 'none'}`;
      } catch(e) {}
    }

    // auto-fill from localStorage
    const saved = localStorage.getItem('backendUrl');
    if (saved) document.getElementById('backendUrl').value = saved;
    document.getElementById('backendUrl').addEventListener('change', e =>
      localStorage.setItem('backendUrl', e.target.value));
  </script>
</body>
</html>
